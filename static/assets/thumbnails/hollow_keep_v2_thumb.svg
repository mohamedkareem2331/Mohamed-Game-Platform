<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hk2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0815"/>
      <stop offset="40%" stop-color="#151226"/>
      <stop offset="100%" stop-color="#22132e"/>
    </linearGradient>

    <linearGradient id="amberGold2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa5"/>
      <stop offset="40%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#c47d1d"/>
    </linearGradient>

    <linearGradient id="iceCyan2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4f6ff"/>
      <stop offset="50%" stop-color="#8fe3ff"/>
      <stop offset="100%" stop-color="#00a8cc"/>
    </linearGradient>

    <linearGradient id="v2BadgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6f8a"/>
      <stop offset="50%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#4fd1b5"/>
    </linearGradient>

    <linearGradient id="corridorCeil" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a0814"/>
      <stop offset="100%" stop-color="#231e38"/>
    </linearGradient>

    <linearGradient id="corridorFloor" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18152c"/>
      <stop offset="100%" stop-color="#36314f"/>
    </linearGradient>

    <filter id="hk2Glow">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="bigGlow2">
      <feGaussianBlur stdDeviation="16" result="bigBlur"/>
      <feGaussianBlur stdDeviation="6" result="sharpBlur"/>
      <feMerge>
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="sharpBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#hk2Bg)"/>

  <!-- 3D Perspective Raycaster Corridor Viewport -->
  <g transform="translate(180, 50)">
    <!-- Corridor Frame -->
    <rect x="0" y="0" width="440" height="260" rx="12" fill="#090712" stroke="#443e63" stroke-width="2"/>
    
    <!-- Ceiling & Floor Gradients -->
    <polygon points="0,0 440,0 300,100 140,100" fill="url(#corridorCeil)"/>
    <polygon points="0,260 440,260 300,160 140,160" fill="url(#corridorFloor)"/>
    
    <!-- Left & Right Stone Walls -->
    <polygon points="0,0 140,100 140,160 0,260" fill="#2d2747" stroke="#1d1930" stroke-width="1.5"/>
    <polygon points="440,0 300,100 300,160 440,260" fill="#26213d" stroke="#1d1930" stroke-width="1.5"/>

    <!-- Far Portal Doorway -->
    <rect x="140" y="100" width="160" height="60" fill="#120e21" stroke="#ffb454" stroke-width="2"/>
    <rect x="185" y="108" width="70" height="52" rx="4" fill="#ffb454" opacity="0.85" filter="url(#hk2Glow)"/>

    <!-- Perspective Wall Brick Lines -->
    <!-- Left Wall Bricks -->
    <line x1="0" y1="65" x2="140" y2="115" stroke="#3d365e" stroke-width="1.5"/>
    <line x1="0" y1="130" x2="140" y2="130" stroke="#3d365e" stroke-width="1.5"/>
    <line x1="0" y1="195" x2="140" y2="145" stroke="#3d365e" stroke-width="1.5"/>
    <line x1="70" y1="32" x2="70" y2="97" stroke="#1b172e" stroke-width="1.5"/>
    <line x1="70" y1="162" x2="70" y2="227" stroke="#1b172e" stroke-width="1.5"/>

    <!-- Right Wall Bricks -->
    <line x1="440" y1="65" x2="300" y2="115" stroke="#363054" stroke-width="1.5"/>
    <line x1="440" y1="130" x2="300" y2="130" stroke="#363054" stroke-width="1.5"/>
    <line x1="440" y1="195" x2="300" y2="145" stroke="#363054" stroke-width="1.5"/>
    <line x1="370" y1="32" x2="370" y2="97" stroke="#171428" stroke-width="1.5"/>
    <line x1="370" y1="162" x2="370" y2="227" stroke="#171428" stroke-width="1.5"/>

    <!-- Left & Right Wall Mounted Torches -->
    <!-- Left Torch -->
    <circle cx="65" cy="115" r="14" fill="#ffb454" opacity="0.35" filter="url(#hk2Glow)"/>
    <circle cx="65" cy="115" r="5" fill="#ffe082"/>
    <rect x="63" y="122" width="4" height="15" fill="#5a3b1a"/>

    <!-- Right Torch -->
    <circle cx="375" cy="115" r="14" fill="#ffb454" opacity="0.35" filter="url(#hk2Glow)"/>
    <circle cx="375" cy="115" r="5" fill="#ffe082"/>
    <rect x="373" y="122" width="4" height="15" fill="#5a3b1a"/>

    <!-- First-Person Right Hand Sword -->
    <g transform="translate(370, 240) rotate(-22)">
      <path d="M -4,0 L 4,0 L 3,-90 L 0,-104 L -3,-90 Z" fill="#ffffff" stroke="#9bb7cf" stroke-width="1.5" filter="url(#hk2Glow)"/>
      <rect x="-10" y="0" width="20" height="5" fill="#d9b875"/>
      <rect x="-3" y="5" width="6" height="22" fill="#7a5430"/>
    </g>

    <!-- First-Person Left Hand Shield -->
    <g transform="translate(70, 240) scale(0.95)">
      <path d="M 0,-50 L 32,-40 L 32,-12 Q 30,16 0,32 Q -30,16 -32,-12 L -32,-40 Z" fill="#2a8f7c" stroke="#d7f5ee" stroke-width="2.5"/>
      <path d="M 0,-40 L 22,-32 L 22,-10 Q 20,10 0,22 Q -20,10 -22,-10 L -22,-32 Z" fill="#4fd1b5"/>
      <circle cx="0" cy="-10" r="7" fill="#17121f"/>
    </g>

    <!-- Floor Perspective Depth Lines -->
    <line x1="220" y1="160" x2="220" y2="260" stroke="rgba(0,0,0,0.3)" stroke-width="1.5"/>
  </g>

  <!-- Floating Badges -->
  <rect x="45" y="45" width="160" height="34" rx="17" fill="#1b172e" stroke="url(#v2BadgeGrad)" stroke-width="2"/>
  <text x="125" y="67" fill="#ffe699" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">★ VERSION 2.0</text>

  <rect x="595" y="45" width="160" height="34" rx="17" fill="#0f1f2e" stroke="#8fe3ff" stroke-width="1.5"/>
  <text x="675" y="67" fill="#8fe3ff" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="1.5">3D FIRST-PERSON</text>

  <!-- Typography -->
  <text x="400" y="375" fill="#ffffff" font-family="'Orbitron', 'Pirata One', 'Segoe UI', sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="3">
    HOLLOW KEEP: VERSION 2
  </text>
  <text x="400" y="415" fill="url(#amberGold2)" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">
    3D RAYCASTER LABYRINTH &amp; FIRST-PERSON COMBAT
  </text>
  <text x="400" y="445" fill="#a29cbd" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1.5">
    STRAFE &#8226; TURN &#8226; DUEL &#8226; BESTIARY &#8226; ARMORY &#8226; WINDOWS PC .EXE
  </text>
</svg>
