<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="dungeonBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="40%" stop-color="#141120"/>
      <stop offset="100%" stop-color="#26150b"/>
    </linearGradient>

    <linearGradient id="crownGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff2a8"/>
      <stop offset="40%" stop-color="#f5ba42"/>
      <stop offset="100%" stop-color="#9e6611"/>
    </linearGradient>

    <linearGradient id="gemRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4a75"/>
      <stop offset="100%" stop-color="#990b2b"/>
    </linearGradient>

    <linearGradient id="runeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5effeb"/>
      <stop offset="50%" stop-color="#00d4d4"/>
      <stop offset="100%" stop-color="#006b8f"/>
    </linearGradient>

    <linearGradient id="bladeSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#9bb7cf"/>
      <stop offset="100%" stop-color="#3b4b5c"/>
    </linearGradient>

    <filter id="dGlow">
      <feGaussianBlur stdDeviation="7" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow">
      <feGaussianBlur stdDeviation="14" result="bigBlur"/>
      <feGaussianBlur stdDeviation="5" result="sharpBlur"/>
      <feMerge>
        <feMergeNode in="bigBlur"/>
        <feMergeNode in="sharpBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#dungeonBg)"/>

  <!-- Ancient Dungeon Stone Vault Archway (Subtle background) -->
  <g opacity="0.3" stroke="#e0e3da" stroke-width="1.5" fill="none">
    <!-- Arch Pillars -->
    <path d="M 220 330 L 220 180 Q 220 80 400 80 Q 580 80 580 180 L 580 330" stroke="#f5ba42" stroke-width="2.5" opacity="0.6"/>
    <path d="M 250 330 L 250 190 Q 250 110 400 110 Q 550 110 550 190 L 550 330" stroke="#00d4d4" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5"/>
    
    <!-- Stone Brickwork Lines -->
    <line x1="220" y1="220" x2="250" y2="220"/>
    <line x1="220" y1="260" x2="250" y2="260"/>
    <line x1="220" y1="300" x2="250" y2="300"/>
    <line x1="550" y1="220" x2="580" y2="220"/>
    <line x1="550" y1="260" x2="580" y2="260"/>
    <line x1="550" y1="300" x2="580" y2="300"/>

    <!-- Descending Stone Steps -->
    <polygon points="340,300 460,300 480,315 320,315" fill="#1b2333" stroke="#486073"/>
    <polygon points="320,315 480,315 500,330 300,330" fill="#141a27" stroke="#486073"/>
    <polygon points="300,330 500,330 520,345 280,345" fill="#0d111a" stroke="#486073"/>
  </g>

  <!-- Ambient Light Orbs / Torches -->
  <circle cx="220" cy="180" r="45" fill="#ff7700" opacity="0.18" filter="url(#intenseGlow)"/>
  <circle cx="220" cy="180" r="5" fill="#ffe29a" filter="url(#dGlow)"/>
  <circle cx="580" cy="180" r="45" fill="#ff7700" opacity="0.18" filter="url(#intenseGlow)"/>
  <circle cx="580" cy="180" r="5" fill="#ffe29a" filter="url(#dGlow)"/>

  <!-- Torch Embers (Sparks) -->
  <g fill="#ffbb33" opacity="0.75">
    <circle cx="215" cy="140" r="2"/>
    <circle cx="230" cy="120" r="1.5"/>
    <circle cx="225" cy="95" r="2"/>
    <circle cx="585" cy="135" r="2"/>
    <circle cx="570" cy="115" r="1.5"/>
    <circle cx="575" cy="90" r="2.5"/>
  </g>

  <!-- Central Crest: Crossed Swords & The Radiant Hollow Crown -->
  <g transform="translate(400, 195)">
    <!-- Cyan Magic Aura Ring -->
    <circle cx="0" cy="0" r="130" fill="none" stroke="url(#runeCyan)" stroke-width="2" stroke-dasharray="12 8" opacity="0.4" filter="url(#dGlow)"/>
    <circle cx="0" cy="0" r="105" fill="#101524" stroke="url(#crownGold)" stroke-width="3.5" opacity="0.9"/>
    
    <!-- Crossed Broadswords Behind Crown -->
    <!-- Sword 1: Top-Left to Bottom-Right -->
    <g transform="rotate(-45)" filter="url(#dGlow)">
      <!-- Blade -->
      <polygon points="0,-120 7,-40 5,40 -5,40 -7,-40" fill="url(#bladeSteel)"/>
      <line x1="0" y1="-115" x2="0" y2="40" stroke="#00d4d4" stroke-width="1.8"/>
      <!-- Crossguard -->
      <rect x="-24" y="40" width="48" height="8" rx="3" fill="url(#crownGold)"/>
      <!-- Grip & Pommel -->
      <rect x="-4" y="48" width="8" height="22" fill="#302213"/>
      <circle cx="0" cy="74" r="7" fill="url(#crownGold)"/>
    </g>

    <!-- Sword 2: Top-Right to Bottom-Left -->
    <g transform="rotate(45)" filter="url(#dGlow)">
      <!-- Blade -->
      <polygon points="0,-120 7,-40 5,40 -5,40 -7,-40" fill="url(#bladeSteel)"/>
      <line x1="0" y1="-115" x2="0" y2="40" stroke="#00d4d4" stroke-width="1.8"/>
      <!-- Crossguard -->
      <rect x="-24" y="40" width="48" height="8" rx="3" fill="url(#crownGold)"/>
      <!-- Grip & Pommel -->
      <rect x="-4" y="48" width="8" height="22" fill="#302213"/>
      <circle cx="0" cy="74" r="7" fill="url(#crownGold)"/>
    </g>

    <!-- The Hollow Crown Emblem (Golden Diadem) -->
    <g transform="translate(0, -5)" filter="url(#intenseGlow)">
      <!-- Back Crown Base Shadow -->
      <ellipse cx="0" cy="38" rx="55" ry="14" fill="#140f06" opacity="0.7"/>

      <!-- Crown Silhouette -->
      <path d="M -60,25 
               L -50,-20 
               L -28,5 
               L 0,-38 
               L 28,5 
               L 50,-20 
               L 60,25 
               C 35,42 -35,42 -60,25 Z" 
            fill="url(#crownGold)" 
            stroke="#fff5c0" 
            stroke-width="2.5"/>

      <!-- Crown Inner Inset Arch -->
      <path d="M -48,22 C -25,32 25,32 48,22 C 35,26 -35,26 -48,22 Z" fill="#754707"/>

      <!-- Central Ruby Gem -->
      <polygon points="0,-18 9,-7 0,4 -9,-7" fill="url(#gemRuby)" stroke="#ffeef2" stroke-width="1.5"/>
      <circle cx="0" cy="-7" r="2.5" fill="#ffffff"/>

      <!-- Flanking Cyan Gems -->
      <polygon points="-35,2 -28,9 -35,16 -42,9" fill="url(#runeCyan)" stroke="#ffffff" stroke-width="1"/>
      <polygon points="35,2 42,9 35,16 28,9" fill="url(#runeCyan)" stroke="#ffffff" stroke-width="1"/>

      <!-- Crown Peak Jewels -->
      <circle cx="0" cy="-40" r="4.5" fill="#fff5c0"/>
      <circle cx="-50" cy="-22" r="3.5" fill="url(#gemRuby)"/>
      <circle cx="50" cy="-22" r="3.5" fill="url(#gemRuby)"/>
    </g>
  </g>

  <!-- Floating Badges -->
  <rect x="50" y="45" width="140" height="32" rx="16" fill="#1a1410" stroke="#f5ba42" stroke-width="1.5"/>
  <text x="120" y="66" fill="#ffe29a" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">ROGUELIKE RPG</text>

  <rect x="610" y="45" width="140" height="32" rx="16" fill="#101924" stroke="#00d4d4" stroke-width="1.5"/>
  <text x="680" y="66" fill="#5effeb" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">5 FLOORS &#8226; BOSS</text>

  <!-- Typography -->
  <text x="400" y="390" fill="#ffffff" font-family="'Orbitron', 'Segoe UI', sans-serif" font-size="34" font-weight="900" text-anchor="middle" letter-spacing="3">
    DUNGEON
  </text>
  <text x="400" y="425" fill="#f5ba42" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="600" text-anchor="middle" letter-spacing="2">
    THE HOLLOW CROWN
  </text>
  <text x="400" y="452" fill="#8999a0" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1.5">
    TACTICAL TURN-BASED EXPEDITION
  </text>
</svg>